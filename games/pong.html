<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Pong</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #020617;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 12px;
    }
    .hud {
      display: flex;
      justify-content: space-around;
      width: 100%;
      max-width: 480px;
      margin-bottom: 12px;
      font-family: monospace;
      font-size: 28px;
      font-weight: bold;
    }
    #game-container {
      position: relative;
      border: 3px solid #334155;
      border-radius: 8px;
      overflow: hidden;
    }
    canvas { display: block; background: #000; }
    .controls-bar {
      display: flex;
      gap: 12px;
      margin-top: 14px;
    }
    .btn {
      background: #3b82f6;
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
    }
    .tip { margin-top: 10px; font-size: 13px; color: #64748b; }
  </style>
</head>
<body>
  <div class="hud">
    <div style="color: #38bdf8;">YOU: <span id="p1-score">0</span></div>
    <div style="color: #f43f5e;">CPU: <span id="p2-score">0</span></div>
  </div>

  <div id="game-container">
    <canvas id="canvas" width="480" height="340"></canvas>
  </div>

  <div class="controls-bar">
    <button class="btn" id="mode-btn">Mode: 1P vs CPU</button>
    <button class="btn" id="reset-btn" style="background: #475569;">Reset Score</button>
  </div>

  <div class="tip">Move paddle with Mouse / Touch or [W]/[S] / Arrow Keys</div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    const PADDLE_H = 60, PADDLE_W = 10, BALL_SIZE = 8;
    let p1 = { y: 140, score: 0 };
    let p2 = { y: 140, score: 0 };
    let ball = { x: 240, y: 170, vx: 4, vy: 2 };
    let is2P = false;
    let keys = {};

    function playTone(freq, dur) {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
        osc.start();
        osc.stop(audioCtx.currentTime + dur);
      } catch(e){}
    }

    function resetBall(direction = 1) {
      ball.x = canvas.width / 2;
      ball.y = canvas.height / 2;
      ball.vx = 4 * direction;
      ball.vy = (Math.random() * 4 - 2);
    }

    function update() {
      // Key controls P1
      if (keys['KeyW'] || keys['ArrowUp']) p1.y = Math.max(0, p1.y - 5);
      if (keys['KeyS'] || keys['ArrowDown']) p1.y = Math.min(canvas.height - PADDLE_H, p1.y + 5);

      // P2 (CPU or 2P)
      if (is2P) {
        if (keys['KeyI']) p2.y = Math.max(0, p2.y - 5);
        if (keys['KeyK']) p2.y = Math.min(canvas.height - PADDLE_H, p2.y + 5);
      } else {
        // CPU AI tracking
        const center = p2.y + PADDLE_H / 2;
        if (center < ball.y - 12) p2.y += 3.8;
        else if (center > ball.y + 12) p2.y -= 3.8;
        p2.y = Math.max(0, Math.min(canvas.height - PADDLE_H, p2.y));
      }

      // Ball move
      ball.x += ball.vx;
      ball.y += ball.vy;

      // Bounce top/bottom
      if (ball.y <= 0 || ball.y >= canvas.height - BALL_SIZE) {
        ball.vy = -ball.vy;
        playTone(300, 0.05);
      }

      // Paddle 1 collision
      if (ball.x <= 20 + PADDLE_W && ball.x >= 20 && ball.y + BALL_SIZE >= p1.y && ball.y <= p1.y + PADDLE_H) {
        ball.vx = Math.abs(ball.vx) * 1.05;
        const offset = (ball.y + BALL_SIZE/2) - (p1.y + PADDLE_H/2);
        ball.vy = offset * 0.15;
        playTone(450, 0.05);
      }

      // Paddle 2 collision
      if (ball.x + BALL_SIZE >= canvas.width - 20 - PADDLE_W && ball.x + BALL_SIZE <= canvas.width - 20 && ball.y + BALL_SIZE >= p2.y && ball.y <= p2.y + PADDLE_H) {
        ball.vx = -Math.abs(ball.vx) * 1.05;
        const offset = (ball.y + BALL_SIZE/2) - (p2.y + PADDLE_H/2);
        ball.vy = offset * 0.15;
        playTone(450, 0.05);
      }

      // Scoring
      if (ball.x < 0) {
        p2.score++;
        document.getElementById('p2-score').textContent = p2.score;
        playTone(180, 0.2);
        resetBall(1);
      } else if (ball.x > canvas.width) {
        p1.score++;
        document.getElementById('p1-score').textContent = p1.score;
        playTone(600, 0.2);
        resetBall(-1);
      }
    }

    function draw() {
      ctx.fillStyle = '#020617';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Center dotted line
      ctx.strokeStyle = '#1e293b';
      ctx.lineWidth = 4;
      ctx.setLineDash([8, 8]);
      ctx.beginPath();
      ctx.moveTo(canvas.width / 2, 0);
      ctx.lineTo(canvas.width / 2, canvas.height);
      ctx.stroke();
      ctx.setLineDash([]);

      // P1
      ctx.fillStyle = '#38bdf8';
      ctx.fillRect(20, p1.y, PADDLE_W, PADDLE_H);

      // P2
      ctx.fillStyle = '#f43f5e';
      ctx.fillRect(canvas.width - 20 - PADDLE_W, p2.y, PADDLE_W, PADDLE_H);

      // Ball
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(ball.x, ball.y, BALL_SIZE, BALL_SIZE);
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    canvas.addEventListener('mousemove', e => {
      const rect = canvas.getBoundingClientRect();
      const my = e.clientY - rect.top;
      p1.y = Math.max(0, Math.min(canvas.height - PADDLE_H, my - PADDLE_H / 2));
    });

    canvas.addEventListener('touchmove', e => {
      e.preventDefault();
      const rect = canvas.getBoundingClientRect();
      const ty = e.touches[0].clientY - rect.top;
      p1.y = Math.max(0, Math.min(canvas.height - PADDLE_H, ty - PADDLE_H / 2));
    }, { passive: false });

    window.addEventListener('keydown', e => { keys[e.code] = true; });
    window.addEventListener('keyup', e => { keys[e.code] = false; });

    document.getElementById('mode-btn').onclick = () => {
      is2P = !is2P;
      document.getElementById('mode-btn').textContent = is2P ? 'Mode: 2P Local (I/K)' : 'Mode: 1P vs CPU';
    };

    document.getElementById('reset-btn').onclick = () => {
      p1.score = 0; p2.score = 0;
      document.getElementById('p1-score').textContent = '0';
      document.getElementById('p2-score').textContent = '0';
      resetBall();
    };

    requestAnimationFrame(loop);
  </script>
</body>
</html>
