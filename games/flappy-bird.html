<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Flappy Bird</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #0f172a;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 12px;
    }
    #game-container {
      position: relative;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      border: 2px solid #334155;
      background: #70c5ce;
    }
    canvas { display: block; }
    .hud {
      position: absolute;
      top: 16px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 36px;
      font-weight: 800;
      color: #fff;
      text-shadow: 2px 2px 0 #000;
      pointer-events: none;
    }
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.75);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      backdrop-filter: blur(2px);
    }
    .btn {
      background: #f59e0b;
      color: #000;
      font-weight: 800;
      padding: 10px 24px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 4px 0 #d97706;
    }
    .btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #d97706; }
    .tip { margin-top: 12px; font-size: 13px; color: #94a3b8; }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="canvas" width="360" height="500"></canvas>
    <div id="score" class="hud">0</div>
    <div id="start-overlay" class="overlay">
      <h2 style="font-size: 32px; color: #f59e0b;">Flappy Bird</h2>
      <p style="color: #cbd5e1; font-size: 14px;">Tap or Press Space to Flap</p>
      <button class="btn" id="start-btn">TAP TO PLAY</button>
    </div>
    <div id="death-overlay" class="overlay" style="display: none;">
      <h2 style="font-size: 28px; color: #ef4444;">GAME OVER</h2>
      <p id="final-score" style="font-size: 18px; color: #fff;">Score: 0</p>
      <p id="best-score" style="font-size: 14px; color: #f59e0b;">Best: 0</p>
      <button class="btn" id="restart-btn" style="margin-top: 8px;">PLAY AGAIN</button>
    </div>
  </div>

  <div class="tip">Press [SPACE] or Click/Tap anywhere to fly</div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    let bird = { x: 60, y: 220, radius: 14, velocity: 0, gravity: 0.28, jump: -6.2, rotation: 0 };
    let pipes = [];
    let score = 0;
    let best = parseInt(localStorage.getItem('np_flappy_best') || '0', 10);
    let state = 'START'; // START, PLAYING, GAMEOVER
    let frame = 0;

    function playTone(freq, dur) {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
        osc.start();
        osc.stop(audioCtx.currentTime + dur);
      } catch(e){}
    }

    function flap() {
      if (state === 'START') {
        startGame();
      } else if (state === 'PLAYING') {
        bird.velocity = bird.jump;
        playTone(400, 0.08);
      }
    }

    function startGame() {
      state = 'PLAYING';
      bird.y = 220;
      bird.velocity = 0;
      pipes = [];
      score = 0;
      document.getElementById('score').textContent = '0';
      document.getElementById('start-overlay').style.display = 'none';
      document.getElementById('death-overlay').style.display = 'none';
    }

    function gameOver() {
      state = 'GAMEOVER';
      playTone(150, 0.25);
      if (score > best) {
        best = score;
        localStorage.setItem('np_flappy_best', best);
      }
      document.getElementById('final-score').textContent = `Score: ${score}`;
      document.getElementById('best-score').textContent = `Best: ${best}`;
      document.getElementById('death-overlay').style.display = 'flex';
    }

    function update() {
      frame++;
      if (state === 'PLAYING') {
        bird.velocity += bird.gravity;
        bird.y += bird.velocity;
        bird.rotation = Math.min(Math.PI / 4, Math.max(-Math.PI / 4, (bird.velocity * 0.08)));

        // Floor / Ceiling
        if (bird.y + bird.radius >= canvas.height - 40 || bird.y - bird.radius <= 0) {
          gameOver();
        }

        // Spawn pipes
        if (frame % 95 === 0) {
          const gap = 115;
          const minPipe = 40;
          const maxPipe = canvas.height - 40 - gap - minPipe;
          const topHeight = Math.floor(Math.random() * (maxPipe - minPipe)) + minPipe;
          pipes.push({
            x: canvas.width,
            top: topHeight,
            bottom: topHeight + gap,
            passed: false
          });
        }

        // Move pipes
        for (let i = pipes.length - 1; i >= 0; i--) {
          const p = pipes[i];
          p.x -= 2.2;

          // Score check
          if (!p.passed && p.x + 50 < bird.x) {
            p.passed = true;
            score++;
            document.getElementById('score').textContent = score;
            playTone(600, 0.08);
          }

          // Collision check
          if (bird.x + bird.radius > p.x && bird.x - bird.radius < p.x + 50) {
            if (bird.y - bird.radius < p.top || bird.y + bird.radius > p.bottom) {
              gameOver();
            }
          }

          if (p.x < -60) {
            pipes.splice(i, 1);
          }
        }
      }
    }

    function draw() {
      // Sky
      ctx.fillStyle = '#70c5ce';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Clouds
      ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
      ctx.beginPath();
      ctx.arc(80, 80, 24, 0, Math.PI * 2);
      ctx.arc(110, 75, 30, 0, Math.PI * 2);
      ctx.arc(140, 80, 22, 0, Math.PI * 2);
      ctx.fill();

      ctx.beginPath();
      ctx.arc(260, 110, 24, 0, Math.PI * 2);
      ctx.arc(290, 105, 32, 0, Math.PI * 2);
      ctx.arc(320, 110, 20, 0, Math.PI * 2);
      ctx.fill();

      // Pipes
      pipes.forEach(p => {
        ctx.fillStyle = '#22c55e';
        ctx.strokeStyle = '#15803d';
        ctx.lineWidth = 3;

        // Top pipe
        ctx.fillRect(p.x, 0, 50, p.top);
        ctx.strokeRect(p.x, 0, 50, p.top);
        // Top cap
        ctx.fillRect(p.x - 3, p.top - 18, 56, 18);
        ctx.strokeRect(p.x - 3, p.top - 18, 56, 18);

        // Bottom pipe
        const bottomH = canvas.height - 40 - p.bottom;
        ctx.fillRect(p.x, p.bottom, 50, bottomH);
        ctx.strokeRect(p.x, p.bottom, 50, bottomH);
        // Bottom cap
        ctx.fillRect(p.x - 3, p.bottom, 56, 18);
        ctx.strokeRect(p.x - 3, p.bottom, 56, 18);
      });

      // Ground
      ctx.fillStyle = '#ded895';
      ctx.fillRect(0, canvas.height - 40, canvas.width, 40);
      ctx.fillStyle = '#16a34a';
      ctx.fillRect(0, canvas.height - 40, canvas.width, 8);

      // Bird
      ctx.save();
      ctx.translate(bird.x, bird.y);
      ctx.rotate(bird.rotation);

      // Bird body
      ctx.fillStyle = '#eab308';
      ctx.beginPath();
      ctx.arc(0, 0, bird.radius, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#a16207';
      ctx.lineWidth = 2;
      ctx.stroke();

      // Wing
      ctx.fillStyle = '#ca8a04';
      ctx.beginPath();
      ctx.ellipse(-4, 2, 7, 5, 0, 0, Math.PI * 2);
      ctx.fill();

      // Eye
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(6, -4, 5, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#000';
      ctx.beginPath();
      ctx.arc(8, -4, 2, 0, Math.PI * 2);
      ctx.fill();

      // Beak
      ctx.fillStyle = '#f97316';
      ctx.beginPath();
      ctx.moveTo(10, 0);
      ctx.lineTo(19, 4);
      ctx.lineTo(10, 7);
      ctx.fill();

      ctx.restore();
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space' || e.code === 'ArrowUp') {
        e.preventDefault();
        flap();
      }
    });

    canvas.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      flap();
    });

    document.getElementById('start-btn').onclick = flap;
    document.getElementById('restart-btn').onclick = startGame;

    requestAnimationFrame(loop);
  </script>
</body>
</html>
