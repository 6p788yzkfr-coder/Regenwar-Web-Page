<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Snake</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #090d16;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 12px;
    }
    .hud {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      max-width: 440px;
      margin-bottom: 12px;
      background: #131c2e;
      padding: 10px 16px;
      border-radius: 10px;
      border: 1px solid #1e293b;
    }
    .stat {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .stat-label { font-size: 11px; text-transform: uppercase; color: #64748b; font-weight: 600; }
    .stat-value { font-size: 20px; font-weight: 700; color: #10b981; font-family: monospace; }
    .btn {
      background: #10b981;
      color: #064e3b;
      border: none;
      padding: 6px 14px;
      border-radius: 6px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn:hover { background: #34d399; }
    #canvas-container {
      position: relative;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.7);
      border: 2px solid #1e293b;
      background: #020617;
    }
    canvas { display: block; }
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(2, 6, 23, 0.85);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      backdrop-filter: blur(4px);
    }
    .overlay h2 { font-size: 28px; color: #ef4444; }
    .touch-controls {
      display: grid;
      grid-template-columns: repeat(3, 54px);
      grid-gap: 8px;
      margin-top: 14px;
    }
    .touch-btn {
      width: 54px;
      height: 54px;
      background: #1e293b;
      border: 1px solid #334155;
      color: #fff;
      border-radius: 8px;
      font-size: 20px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .touch-btn:active { background: #334155; }
    .hint { margin-top: 10px; font-size: 12px; color: #64748b; }
  </style>
</head>
<body>
  <div class="hud">
    <div class="stat">
      <span class="stat-label">Score</span>
      <span id="score" class="stat-value">0</span>
    </div>
    <div class="stat">
      <span class="stat-label">Best</span>
      <span id="best" class="stat-value" style="color: #f59e0b;">0</span>
    </div>
    <button class="btn" id="restart-btn">Restart</button>
  </div>

  <div id="canvas-container">
    <canvas id="game" width="400" height="400"></canvas>
    <div id="game-over" class="overlay" style="display: none;">
      <h2 id="death-text">Game Over</h2>
      <p id="final-score" style="color: #94a3b8;">Score: 0</p>
      <button class="btn" id="play-again-btn" style="padding: 10px 24px; font-size: 16px;">Play Again</button>
    </div>
  </div>

  <div class="touch-controls">
    <div></div>
    <button class="touch-btn" id="btn-up">↑</button>
    <div></div>
    <button class="touch-btn" id="btn-left">←</button>
    <button class="touch-btn" id="btn-down">↓</button>
    <button class="touch-btn" id="btn-right">→</button>
  </div>

  <div class="hint">Use Arrow keys or WASD to slither. Eat glowing orbs!</div>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const gridSize = 20;
    const tileCount = 20;

    let snake = [{ x: 10, y: 10 }];
    let food = { x: 15, y: 15 };
    let dx = 1, dy = 0;
    let nextDx = 1, nextDy = 0;
    let score = 0;
    let best = parseInt(localStorage.getItem('np_snake_best') || '0', 10);
    document.getElementById('best').textContent = best;
    let gameLoop = null;
    let isGameOver = false;

    function playTone(freq, dur) {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
        osc.start();
        osc.stop(audioCtx.currentTime + dur);
      } catch(e){}
    }

    function spawnFood() {
      let valid = false;
      while (!valid) {
        food.x = Math.floor(Math.random() * tileCount);
        food.y = Math.floor(Math.random() * tileCount);
        valid = !snake.some(seg => seg.x === food.x && seg.y === food.y);
      }
    }

    function reset() {
      snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
      dx = 1; dy = 0;
      nextDx = 1; nextDy = 0;
      score = 0;
      isGameOver = false;
      document.getElementById('score').textContent = score;
      document.getElementById('game-over').style.display = 'none';
      spawnFood();
      clearInterval(gameLoop);
      gameLoop = setInterval(update, 100);
    }

    function update() {
      if (isGameOver) return;
      dx = nextDx;
      dy = nextDy;

      const head = { x: snake[0].x + dx, y: snake[0].y + dy };

      // Wall collision
      if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
        return gameOver();
      }

      // Self collision
      if (snake.some(seg => seg.x === head.x && seg.y === head.y)) {
        return gameOver();
      }

      snake.unshift(head);

      // Eat food
      if (head.x === food.x && head.y === food.y) {
        score += 10;
        document.getElementById('score').textContent = score;
        if (score > best) {
          best = score;
          localStorage.setItem('np_snake_best', best);
          document.getElementById('best').textContent = best;
        }
        playTone(480, 0.08);
        spawnFood();
      } else {
        snake.pop();
      }

      draw();
    }

    function draw() {
      // Background
      ctx.fillStyle = '#020617';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Grid subtle lines
      ctx.strokeStyle = '#0f172a';
      ctx.lineWidth = 1;
      for (let i = 0; i < canvas.width; i += gridSize) {
        ctx.beginPath();
        ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(0, i); ctx.lineTo(canvas.width, i);
        ctx.stroke();
      }

      // Draw Food
      ctx.fillStyle = '#ef4444';
      ctx.shadowColor = '#ef4444';
      ctx.shadowBlur = 10;
      ctx.beginPath();
      ctx.arc(food.x * gridSize + gridSize/2, food.y * gridSize + gridSize/2, gridSize/2 - 2, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;

      // Draw Snake
      snake.forEach((seg, i) => {
        if (i === 0) {
          ctx.fillStyle = '#10b981';
          ctx.shadowColor = '#10b981';
          ctx.shadowBlur = 8;
        } else {
          ctx.fillStyle = '#059669';
          ctx.shadowBlur = 0;
        }
        ctx.beginPath();
        ctx.roundRect(seg.x * gridSize + 1, seg.y * gridSize + 1, gridSize - 2, gridSize - 2, 4);
        ctx.fill();
      });
      ctx.shadowBlur = 0;
    }

    function gameOver() {
      isGameOver = true;
      clearInterval(gameLoop);
      playTone(180, 0.35);
      document.getElementById('final-score').textContent = `Score: ${score}`;
      document.getElementById('game-over').style.display = 'flex';
    }

    function setDir(x, y) {
      if (x !== 0 && dx === -x) return;
      if (y !== 0 && dy === -y) return;
      nextDx = x;
      nextDy = y;
    }

    window.addEventListener('keydown', (e) => {
      if (['ArrowUp', 'KeyW'].includes(e.code)) { e.preventDefault(); setDir(0, -1); }
      if (['ArrowDown', 'KeyS'].includes(e.code)) { e.preventDefault(); setDir(0, 1); }
      if (['ArrowLeft', 'KeyA'].includes(e.code)) { e.preventDefault(); setDir(-1, 0); }
      if (['ArrowRight', 'KeyD'].includes(e.code)) { e.preventDefault(); setDir(1, 0); }
    });

    document.getElementById('btn-up').onclick = () => setDir(0, -1);
    document.getElementById('btn-down').onclick = () => setDir(0, 1);
    document.getElementById('btn-left').onclick = () => setDir(-1, 0);
    document.getElementById('btn-right').onclick = () => setDir(1, 0);
    document.getElementById('restart-btn').onclick = reset;
    document.getElementById('play-again-btn').onclick = reset;

    reset();
  </script>
</body>
</html>
