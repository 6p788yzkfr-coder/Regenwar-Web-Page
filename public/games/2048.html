<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>2048</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 16px;
    }
    .header {
      width: 100%;
      max-width: 400px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .title {
      font-size: 38px;
      font-weight: 800;
      color: #f59e0b;
      letter-spacing: -1px;
    }
    .scores {
      display: flex;
      gap: 8px;
    }
    .score-box {
      background: #1e293b;
      border: 1px solid #334155;
      padding: 6px 12px;
      border-radius: 8px;
      text-align: center;
      min-width: 70px;
    }
    .score-label {
      font-size: 10px;
      text-transform: uppercase;
      color: #94a3b8;
      font-weight: 600;
    }
    .score-val {
      font-size: 18px;
      font-weight: 700;
      color: #fff;
    }
    .controls-bar {
      width: 100%;
      max-width: 400px;
      display: flex;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .btn {
      background: #2563eb;
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn:hover { background: #1d4ed8; }
    .grid-container {
      width: 100%;
      max-width: 400px;
      aspect-ratio: 1;
      background: #1e293b;
      border-radius: 12px;
      padding: 12px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-gap: 10px;
      position: relative;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    }
    .tile {
      background: #334155;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      font-weight: 700;
      color: #f8fafc;
      transition: all 0.12s ease-in-out;
    }
    .tile-2 { background: #475569; color: #f8fafc; }
    .tile-4 { background: #64748b; color: #f8fafc; }
    .tile-8 { background: #f97316; color: #fff; }
    .tile-16 { background: #ea580c; color: #fff; }
    .tile-32 { background: #e11d48; color: #fff; }
    .tile-64 { background: #be123c; color: #fff; }
    .tile-128 { background: #eab308; color: #000; font-size: 24px; box-shadow: 0 0 12px #eab308; }
    .tile-256 { background: #ca8a04; color: #000; font-size: 24px; box-shadow: 0 0 14px #ca8a04; }
    .tile-512 { background: #10b981; color: #000; font-size: 24px; box-shadow: 0 0 16px #10b981; }
    .tile-1024 { background: #06b6d4; color: #000; font-size: 20px; box-shadow: 0 0 18px #06b6d4; }
    .tile-2048 { background: #8b5cf6; color: #fff; font-size: 20px; box-shadow: 0 0 24px #8b5cf6; }
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.88);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(4px);
    }
    .overlay h2 { font-size: 32px; margin-bottom: 12px; color: #f59e0b; }
    .tip { margin-top: 14px; font-size: 12px; color: #64748b; text-align: center; }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">2048</div>
    <div class="scores">
      <div class="score-box">
        <div class="score-label">Score</div>
        <div id="score" class="score-val">0</div>
      </div>
      <div class="score-box">
        <div class="score-label">Best</div>
        <div id="best-score" class="score-val">0</div>
      </div>
    </div>
  </div>

  <div class="controls-bar">
    <button class="btn" id="new-game-btn">New Game</button>
    <button class="btn" style="background:#475569" id="undo-btn">Undo</button>
  </div>

  <div class="grid-container" id="grid">
    <div id="game-over" class="overlay" style="display: none;">
      <h2 id="game-status">Game Over!</h2>
      <button class="btn" id="retry-btn">Try Again</button>
    </div>
  </div>

  <div class="tip">Swipe or use Arrow Keys / WASD to join the numbers.</div>

  <script>
    let grid = Array(4).fill(null).map(() => Array(4).fill(0));
    let previousGrid = null;
    let score = 0;
    let previousScore = 0;
    let bestScore = parseInt(localStorage.getItem('np_2048_best') || '0', 10);
    document.getElementById('best-score').textContent = bestScore;

    function playTone(freq, duration) {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.04, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
        osc.start();
        osc.stop(ctx.currentTime + duration);
      } catch(e){}
    }

    function initGame() {
      grid = Array(4).fill(null).map(() => Array(4).fill(0));
      score = 0;
      updateScore();
      addRandomTile();
      addRandomTile();
      render();
      document.getElementById('game-over').style.display = 'none';
    }

    function addRandomTile() {
      const emptyCells = [];
      for (let r = 0; r < 4; r++) {
        for (let c = 0; c < 4; c++) {
          if (grid[r][c] === 0) emptyCells.push({ r, c });
        }
      }
      if (emptyCells.length > 0) {
        const spot = emptyCells[Math.floor(Math.random() * emptyCells.length)];
        grid[spot.r][spot.c] = Math.random() < 0.9 ? 2 : 4;
      }
    }

    function render() {
      const gridEl = document.getElementById('grid');
      // Keep overlay
      const overlay = document.getElementById('game-over');
      gridEl.innerHTML = '';
      gridEl.appendChild(overlay);

      for (let r = 0; r < 4; r++) {
        for (let c = 0; c < 4; c++) {
          const val = grid[r][c];
          const tile = document.createElement('div');
          tile.className = 'tile' + (val > 0 ? ` tile-${val}` : '');
          tile.textContent = val > 0 ? val : '';
          gridEl.appendChild(tile);
        }
      }
    }

    function updateScore() {
      document.getElementById('score').textContent = score;
      if (score > bestScore) {
        bestScore = score;
        localStorage.setItem('np_2048_best', bestScore);
        document.getElementById('best-score').textContent = bestScore;
      }
    }

    function slide(row) {
      let filtered = row.filter(val => val !== 0);
      for (let i = 0; i < filtered.length - 1; i++) {
        if (filtered[i] === filtered[i + 1]) {
          filtered[i] *= 2;
          score += filtered[i];
          filtered[i + 1] = 0;
          playTone(280 + filtered[i] * 2, 0.08);
        }
      }
      filtered = filtered.filter(val => val !== 0);
      while (filtered.length < 4) {
        filtered.push(0);
      }
      return filtered;
    }

    function move(direction) {
      let rotated = false;
      const prev = JSON.stringify(grid);
      previousGrid = JSON.parse(prev);
      previousScore = score;

      let newGrid = Array(4).fill(null).map(() => Array(4).fill(0));

      if (direction === 'left') {
        for (let r = 0; r < 4; r++) newGrid[r] = slide(grid[r]);
      } else if (direction === 'right') {
        for (let r = 0; r < 4; r++) {
          let row = [...grid[r]].reverse();
          row = slide(row).reverse();
          newGrid[r] = row;
        }
      } else if (direction === 'up') {
        for (let c = 0; c < 4; c++) {
          let col = [grid[0][c], grid[1][c], grid[2][c], grid[3][c]];
          let slided = slide(col);
          for (let r = 0; r < 4; r++) newGrid[r][c] = slided[r];
        }
      } else if (direction === 'down') {
        for (let c = 0; c < 4; c++) {
          let col = [grid[3][c], grid[2][c], grid[1][c], grid[0][c]];
          let slided = slide(col).reverse();
          for (let r = 0; r < 4; r++) newGrid[r][c] = slided[r];
        }
      }

      if (JSON.stringify(newGrid) !== prev) {
        grid = newGrid;
        addRandomTile();
        updateScore();
        render();
        checkGameOver();
      }
    }

    function checkGameOver() {
      for (let r = 0; r < 4; r++) {
        for (let c = 0; c < 4; c++) {
          if (grid[r][c] === 0) return;
          if (c < 3 && grid[r][c] === grid[r][c + 1]) return;
          if (r < 3 && grid[r][c] === grid[r + 1][c]) return;
        }
      }
      // No moves left
      document.getElementById('game-status').textContent = 'Game Over!';
      document.getElementById('game-over').style.display = 'flex';
      playTone(150, 0.3);
    }

    document.getElementById('undo-btn').addEventListener('click', () => {
      if (previousGrid) {
        grid = JSON.parse(JSON.stringify(previousGrid));
        score = previousScore;
        updateScore();
        render();
        document.getElementById('game-over').style.display = 'none';
      }
    });

    document.getElementById('new-game-btn').addEventListener('click', initGame);
    document.getElementById('retry-btn').addEventListener('click', initGame);

    window.addEventListener('keydown', (e) => {
      if (['ArrowUp', 'KeyW'].includes(e.code)) { e.preventDefault(); move('up'); }
      else if (['ArrowDown', 'KeyS'].includes(e.code)) { e.preventDefault(); move('down'); }
      else if (['ArrowLeft', 'KeyA'].includes(e.code)) { e.preventDefault(); move('left'); }
      else if (['ArrowRight', 'KeyD'].includes(e.code)) { e.preventDefault(); move('right'); }
    });

    // Touch swipe
    let touchStartX = 0, touchStartY = 0;
    window.addEventListener('touchstart', (e) => {
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
    }, { passive: true });

    window.addEventListener('touchend', (e) => {
      const dx = e.changedTouches[0].clientX - touchStartX;
      const dy = e.changedTouches[0].clientY - touchStartY;
      if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 30) {
        move(dx > 0 ? 'right' : 'left');
      } else if (Math.abs(dy) > 30) {
        move(dy > 0 ? 'down' : 'up');
      }
    }, { passive: true });

    initGame();
  </script>
</body>
</html>
