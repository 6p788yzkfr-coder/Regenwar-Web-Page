<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Space Invaders</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #020617;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 12px;
    }
    .hud {
      display: flex;
      justify-content: space-between;
      width: 100%;
      max-width: 440px;
      margin-bottom: 8px;
      font-family: monospace;
      font-size: 14px;
      color: #10b981;
    }
    #game-box {
      position: relative;
      border: 2px solid #1e293b;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 0 24px rgba(16, 185, 129, 0.2);
    }
    canvas { display: block; background: #000; }
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }
    .btn {
      background: #10b981;
      color: #000;
      font-weight: bold;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 15px;
    }
    .controls {
      display: flex;
      gap: 12px;
      margin-top: 10px;
    }
    .c-btn {
      background: #1e293b;
      color: #fff;
      border: 1px solid #334155;
      padding: 10px 18px;
      border-radius: 6px;
      font-size: 18px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="hud">
    <span>SCORE: <b id="score">0</b></span>
    <span>LIVES: <b id="lives">3</b></span>
    <span>WAVE: <b id="wave">1</b></span>
  </div>

  <div id="game-box">
    <canvas id="canvas" width="440" height="480"></canvas>
    <div id="overlay" class="overlay" style="display: none;">
      <h2 id="msg-title" style="font-size: 26px; color: #ef4444;">GAME OVER</h2>
      <button class="btn" id="restart-btn">PLAY AGAIN</button>
    </div>
  </div>

  <div class="controls">
    <button class="c-btn" id="btn-left">◀</button>
    <button class="c-btn" id="btn-fire" style="background: #ef4444; color: #fff;">FIRE</button>
    <button class="c-btn" id="btn-right">▶</button>
  </div>

  <div style="margin-top: 10px; font-size: 12px; color: #64748b;">
    [←] [→] to Move, [SPACE] to Shoot
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    let player = { x: 200, y: 440, w: 28, h: 16, speed: 4 };
    let bullets = [];
    let enemyBullets = [];
    let enemies = [];
    let shields = [];
    let enemyDir = 1;
    let enemySpeed = 0.8;
    let score = 0, lives = 3, wave = 1;
    let isGameOver = false;
    let keys = {};

    function playTone(freq, dur) {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
        osc.start();
        osc.stop(audioCtx.currentTime + dur);
      } catch(e){}
    }

    function initEnemies() {
      enemies = [];
      const rows = 4, cols = 8;
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          enemies.push({
            x: 40 + c * 44,
            y: 40 + r * 32,
            w: 24,
            h: 18,
            type: r,
            alive: true
          });
        }
      }
      enemySpeed = 0.6 + wave * 0.2;
    }

    function initShields() {
      shields = [];
      for (let i = 0; i < 4; i++) {
        const bx = 50 + i * 100;
        for (let sx = 0; sx < 4; sx++) {
          for (let sy = 0; sy < 3; sy++) {
            shields.push({ x: bx + sx * 8, y: 380 + sy * 8, w: 8, h: 8, hp: 2 });
          }
        }
      }
    }

    function restart() {
      score = 0;
      lives = 3;
      wave = 1;
      isGameOver = false;
      player.x = 200;
      bullets = [];
      enemyBullets = [];
      document.getElementById('score').textContent = score;
      document.getElementById('lives').textContent = lives;
      document.getElementById('wave').textContent = wave;
      document.getElementById('overlay').style.display = 'none';
      initEnemies();
      initShields();
    }

    function shoot() {
      if (bullets.length < 3 && !isGameOver) {
        bullets.push({ x: player.x + player.w / 2 - 2, y: player.y, w: 4, h: 10 });
        playTone(700, 0.05);
      }
    }

    function update() {
      if (isGameOver) return;

      if (keys['ArrowLeft'] || keys['KeyA']) player.x = Math.max(10, player.x - player.speed);
      if (keys['ArrowRight'] || keys['KeyD']) player.x = Math.min(canvas.width - player.w - 10, player.x + player.speed);

      // Player bullets
      for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        b.y -= 7;
        if (b.y < 0) { bullets.splice(i, 1); continue; }

        // Hit enemy
        for (let e of enemies) {
          if (e.alive && b.x > e.x && b.x < e.x + e.w && b.y > e.y && b.y < e.y + e.h) {
            e.alive = false;
            bullets.splice(i, 1);
            score += (4 - e.type) * 10;
            document.getElementById('score').textContent = score;
            playTone(250, 0.08);
            break;
          }
        }
      }

      // Enemy movement
      let hitEdge = false;
      const aliveEnemies = enemies.filter(e => e.alive);
      if (aliveEnemies.length === 0) {
        wave++;
        document.getElementById('wave').textContent = wave;
        initEnemies();
        return;
      }

      for (let e of aliveEnemies) {
        e.x += enemyDir * enemySpeed;
        if (e.x < 10 || e.x + e.w > canvas.width - 10) hitEdge = true;
        if (e.y + e.h >= player.y) {
          endGame('INVADED!');
          return;
        }
      }

      if (hitEdge) {
        enemyDir *= -1;
        aliveEnemies.forEach(e => e.y += 12);
      }

      // Enemy shoot
      if (Math.random() < 0.03 && aliveEnemies.length > 0) {
        const shooter = aliveEnemies[Math.floor(Math.random() * aliveEnemies.length)];
        enemyBullets.push({ x: shooter.x + shooter.w / 2, y: shooter.y + shooter.h, w: 4, h: 8 });
      }

      // Enemy bullets
      for (let i = enemyBullets.length - 1; i >= 0; i--) {
        const eb = enemyBullets[i];
        eb.y += 3.5;
        if (eb.y > canvas.height) { enemyBullets.splice(i, 1); continue; }

        // Hit player
        if (eb.x > player.x && eb.x < player.x + player.w && eb.y > player.y && eb.y < player.y + player.h) {
          enemyBullets.splice(i, 1);
          lives--;
          document.getElementById('lives').textContent = lives;
          playTone(120, 0.2);
          if (lives <= 0) endGame('GAME OVER');
          continue;
        }

        // Hit shields
        for (let s of shields) {
          if (s.hp > 0 && eb.x > s.x && eb.x < s.x + s.w && eb.y > s.y && eb.y < s.y + s.h) {
            s.hp--;
            enemyBullets.splice(i, 1);
            break;
          }
        }
      }
    }

    function endGame(text) {
      isGameOver = true;
      document.getElementById('msg-title').textContent = text;
      document.getElementById('overlay').style.display = 'flex';
    }

    function draw() {
      ctx.fillStyle = '#020617';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Stars
      ctx.fillStyle = '#ffffff';
      for (let i = 0; i < 25; i++) {
        ctx.fillRect((i * 47) % canvas.width, (i * 91) % canvas.height, 1.5, 1.5);
      }

      // Player
      ctx.fillStyle = '#10b981';
      ctx.fillRect(player.x, player.y + 6, player.w, 10);
      ctx.fillRect(player.x + player.w / 2 - 3, player.y, 6, 6);

      // Player bullets
      ctx.fillStyle = '#38bdf8';
      bullets.forEach(b => ctx.fillRect(b.x, b.y, b.w, b.h));

      // Enemy bullets
      ctx.fillStyle = '#f43f5e';
      enemyBullets.forEach(eb => ctx.fillRect(eb.x, eb.y, eb.w, eb.h));

      // Enemies
      const colors = ['#ec4899', '#a855f7', '#3b82f6', '#14b8a6'];
      enemies.forEach(e => {
        if (!e.alive) return;
        ctx.fillStyle = colors[e.type] || '#fff';
        ctx.fillRect(e.x + 3, e.y, e.w - 6, e.h);
        ctx.fillRect(e.x, e.y + 4, e.w, e.h - 8);
        // Eyes
        ctx.fillStyle = '#000';
        ctx.fillRect(e.x + 5, e.y + 6, 3, 3);
        ctx.fillRect(e.x + e.w - 8, e.y + 6, 3, 3);
      });

      // Shields
      shields.forEach(s => {
        if (s.hp > 0) {
          ctx.fillStyle = s.hp === 2 ? '#22c55e' : '#86efac';
          ctx.fillRect(s.x, s.y, s.w, s.h);
        }
      });
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    window.addEventListener('keydown', e => {
      keys[e.code] = true;
      if (e.code === 'Space') { e.preventDefault(); shoot(); }
    });
    window.addEventListener('keyup', e => { keys[e.code] = false; });

    let leftInt, rightInt;
    const btnL = document.getElementById('btn-left');
    const btnR = document.getElementById('btn-right');
    btnL.onpointerdown = () => { leftInt = setInterval(() => { player.x = Math.max(10, player.x - player.speed); }, 20); };
    btnL.onpointerup = () => clearInterval(leftInt);
    btnR.onpointerdown = () => { rightInt = setInterval(() => { player.x = Math.min(canvas.width - player.w - 10, player.x + player.speed); }, 20); };
    btnR.onpointerup = () => clearInterval(rightInt);
    document.getElementById('btn-fire').onclick = shoot;
    document.getElementById('restart-btn').onclick = restart;

    restart();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
