<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <title>Gladihoppers - Unblocked Fast</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #11141a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
    }
    #gameContainer {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 10;
    }
    #gameContainer canvas {
      width: 100% !important;
      height: 100% !important;
      display: block;
    }

    #loadingOverlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at center, #1e293b 0%, #090d16 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 50;
      color: #fff;
      transition: opacity 0.3s ease, visibility 0.3s ease;
    }
    #loadingOverlay.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .game-logo {
      font-size: 52px;
      margin-bottom: 10px;
      filter: drop-shadow(0 0 20px rgba(239, 68, 68, 0.5));
      animation: bounce 1.8s ease-in-out infinite alternate;
    }
    @keyframes bounce {
      from { transform: translateY(0px) scale(1); }
      to { transform: translateY(-8px) scale(1.06); }
    }
    .game-title {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: 1.5px;
      margin-bottom: 4px;
      color: #f87171;
      text-transform: uppercase;
      text-shadow: 0 2px 14px rgba(239, 68, 68, 0.4);
    }
    .game-subtitle {
      font-size: 13px;
      color: #94a3b8;
      margin-bottom: 24px;
      letter-spacing: 0.5px;
    }
    .progress-box {
      width: 300px;
      max-width: 82vw;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 9999px;
      padding: 3px;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
    }
    .progress-bar {
      height: 12px;
      width: 0%;
      background: linear-gradient(90deg, #ef4444, #f97316, #eab308);
      border-radius: 9999px;
      box-shadow: 0 0 14px rgba(239, 68, 68, 0.8);
      transition: width 0.15s ease-out;
    }
    .status-text {
      font-size: 13px;
      font-weight: 600;
      color: #e2e8f0;
      margin-top: 14px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    .tips-text {
      font-size: 11px;
      color: #64748b;
      margin-top: 18px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .tips-badge {
      background: rgba(239, 68, 68, 0.15);
      color: #fca5a5;
      padding: 3px 10px;
      border-radius: 9999px;
      border: 1px solid rgba(239, 68, 68, 0.3);
      font-weight: 500;
    }
  </style>

  <!-- Complete Poki SDK and PokiBridge Implementation -->
  <script>
    (function() {
      window.config = window.config || {
        cachedDecompressedFileSizes: {
          "Gladihoppers.data.unityweb": 25165824,
          "Gladihoppers.wasm.code.unityweb": 23068672,
          "Gladihoppers.wasm.framework.unityweb": 510976
        }
      };

      window._cachedAdPositions = {};
      let pokiBridgeObjectName = null;
      window.pokiReady = true;

      // Unity PokiBridge hooks called from WebAssembly
      window.initPokiBridge = function(name) {
        pokiBridgeObjectName = name;
        window.pokiBridge = name;
        window.pokiReady = true;
        
        function sendReady() {
          const inst = window.unityGame || window.gameInstance;
          if (inst && typeof inst.SendMessage === 'function') {
            try {
              inst.SendMessage(name, 'ready');
            } catch(e) {
              console.warn("initPokiBridge send ready warning:", e);
            }
          } else {
            setTimeout(sendReady, 50);
          }
        }
        sendReady();
      };

      window.commercialBreak = function() {
        const inst = window.unityGame || window.gameInstance;
        const bridge = pokiBridgeObjectName || window.pokiBridge;
        if (inst && bridge && typeof inst.SendMessage === 'function') {
          try {
            inst.SendMessage(bridge, 'commercialBreakCompleted');
          } catch(e) {}
        }
        return Promise.resolve();
      };

      window.rewardedBreak = function() {
        const inst = window.unityGame || window.gameInstance;
        const bridge = pokiBridgeObjectName || window.pokiBridge;
        if (inst && bridge && typeof inst.SendMessage === 'function') {
          try {
            inst.SendMessage(bridge, 'rewardedBreakCompleted', 'true');
          } catch(e) {}
        }
        return Promise.resolve(true);
      };

      window.shareableURL = function() {
        const inst = window.unityGame || window.gameInstance;
        const bridge = pokiBridgeObjectName || window.pokiBridge;
        if (inst && bridge && typeof inst.SendMessage === 'function') {
          try {
            inst.SendMessage(bridge, 'shareableURLResolved', window.location.href);
          } catch(e) {}
        }
        return Promise.resolve(window.location.href);
      };

      window.getUser = function() {
        const inst = window.unityGame || window.gameInstance;
        const bridge = pokiBridgeObjectName || window.pokiBridge;
        if (inst && bridge && typeof inst.SendMessage === 'function') {
          try {
            inst.SendMessage(bridge, 'getUserResolved', '{}');
          } catch(e) {}
        }
        return Promise.resolve({});
      };

      window.getToken = function() {
        const inst = window.unityGame || window.gameInstance;
        const bridge = pokiBridgeObjectName || window.pokiBridge;
        if (inst && bridge && typeof inst.SendMessage === 'function') {
          try {
            inst.SendMessage(bridge, 'getTokenResolved', '');
          } catch(e) {}
        }
        return Promise.resolve('');
      };

      window.login = function() {
        const inst = window.unityGame || window.gameInstance;
        const bridge = pokiBridgeObjectName || window.pokiBridge;
        if (inst && bridge && typeof inst.SendMessage === 'function') {
          try {
            inst.SendMessage(bridge, 'loginResolved');
          } catch(e) {}
        }
        return Promise.resolve();
      };

      const baseSDK = {
        init: function() { return Promise.resolve(); },
        initWithVideoHB: function() { return Promise.resolve(); },
        customEvent: function() {},
        destroyAd: function() {},
        displayAd: function() { return Promise.resolve(); },
        gameInteractive: function() {},
        gameLoadingFinished: function() {
          const overlay = document.getElementById('loadingOverlay');
          if (overlay) overlay.classList.add('hidden');
        },
        gameLoadingProgress: function(progress) {
          let val = 0;
          if (typeof progress === 'number') {
            val = progress * 100;
          } else if (typeof progress === 'string') {
            try {
              const parsed = JSON.parse(progress);
              if (typeof parsed.percentageDone === 'number') val = parsed.percentageDone * 100;
              else if (typeof parsed === 'number') val = parsed * 100;
            } catch (e) {
              const n = parseFloat(progress);
              if (!isNaN(n)) val = n <= 1 ? n * 100 : n;
            }
          } else if (progress && typeof progress.percentageDone === 'number') {
            val = progress.percentageDone * 100;
          }
          val = Math.min(100, Math.max(0, Math.round(val)));
          const bar = document.getElementById('progressBar');
          const txt = document.getElementById('statusText');
          if (bar) bar.style.width = val + '%';
          if (txt) txt.textContent = val >= 100 ? 'Entering Arena...' : 'Loading Gladiator Arena: ' + val + '%';
        },
        gameLoadingStart: function() {},
        gameplayStart: function() {},
        gameplayStop: function() {},
        happyTime: function() {},
        roundEnd: function() {},
        roundStart: function() {},
        setPlayerAge: function() {},
        togglePlayerAdvertisingConsent: function() {},
        commercialBreak: function() {
          return window.commercialBreak();
        },
        rewardedBreak: function() {
          return window.rewardedBreak();
        },
        isAdBlocked: function() { return false; },
        setDebug: function() {},
        captureError: function() {},
        shareableURL: function() { return window.shareableURL(); },
        getUser: function() { return window.getUser(); },
        getToken: function() { return window.getToken(); },
        login: function() { return window.login(); }
      };

      window.PokiSDK = new Proxy(baseSDK, {
        get: function(target, prop) {
          if (prop in target) return target[prop];
          return function() { return Promise.resolve(); };
        }
      });
    })();
  </script>
</head>
<body>
  <div id="loadingOverlay">
    <div class="game-logo">⚔️</div>
    <div class="game-title">Gladihoppers</div>
    <div class="game-subtitle">High-Speed Unblocked Edition</div>
    <div class="progress-box">
      <div id="progressBar" class="progress-bar"></div>
    </div>
    <div id="statusText" class="status-text">Preparing Gladiator Arena: 0%</div>
    <div class="tips-text">
      <span class="tips-badge">⚡ Instant Cache</span>
      <span class="tips-badge">🛡️ Securly Bypass</span>
      <span class="tips-badge">🎮 Unity WebGL</span>
    </div>
  </div>

  <div id="gameContainer"></div>

  <!-- Local Standalone Unity 2019 WebGL Loader with Patched UnityModule -->
  <script src="Build/UnityLoader.js"></script>
  <script>
    (function() {
      const progressBar = document.getElementById('progressBar');
      const statusText = document.getElementById('statusText');
      const overlay = document.getElementById('loadingOverlay');

      function updateProgress(progress) {
        const percent = Math.min(100, Math.max(0, Math.round(progress * 100)));
        if (progressBar) progressBar.style.width = percent + '%';
        if (statusText) statusText.textContent = percent >= 100 ? 'Entering Arena Combat...' : 'Loading Engine Assets: ' + percent + '%';
        if (percent >= 100) {
          setTimeout(function() {
            if (overlay) overlay.classList.add('hidden');
          }, 300);
        }
      }

      try {
        var gameInstance = UnityLoader.instantiate("gameContainer", "Build/Gladihoppers.json", {
          onProgress: function(instance, progress) {
            updateProgress(progress);
          },
          Module: {
            onRuntimeInitialized: function() {
              if (overlay) overlay.classList.add('hidden');
            }
          }
        });

        window.unityGame = gameInstance;
        window.gameInstance = gameInstance;

        window.addEventListener('click', function() {
          const canvas = document.querySelector('#gameContainer canvas');
          if (canvas) canvas.focus();
        });
      } catch (err) {
        console.error("Gladihoppers startup error:", err);
        if (statusText) statusText.textContent = "Error: " + err.message;
      }
    })();
  </script>
</body>
</html>
